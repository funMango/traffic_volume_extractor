<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교통량 다중 그래프</title>
  <style>
    :root {
      --surface: #ffffff;
      --page: #ffffff;
      --plot: #ffffff;
      --rule: #94a3b8;
      --rule-soft: #e5e7eb;
      --text: #172033;
      --muted: #667085;
      --focus: #2563eb;
      --green: #15803d;
      --amber: #b45309;
      --cyan: #0369a1;
      --coral: #dc2626;
      --violet: #7c3aed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--surface);
      font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    .page {
      width: 210mm;
      max-width: calc(100vw - 32px);
      margin: 32px auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      background: var(--page);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 16px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 13px;
    }

    .legend li {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .swatch {
      width: 22px;
      height: 3px;
      border-radius: 999px;
      background: var(--line-color);
      box-shadow: 0 0 14px color-mix(in srgb, var(--line-color) 45%, transparent);
    }

    .chart-area {
      position: relative;
      padding: 22px 24px 26px;
      background: var(--page);
    }

    .chart-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-gutter: stable;
    }

    .chart-scroll:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .axis-label {
      fill: var(--text);
      font-size: 24px;
      font-weight: 700;
    }

    .tick {
      fill: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 18px;
    }

    .grid {
      stroke: var(--rule-soft);
      stroke-width: 1;
    }

    .axis {
      stroke: var(--rule);
      stroke-width: 2;
    }

    .series {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-opacity: 0.7;
      stroke-width: 3;
    }

    .hover-capture {
      fill: transparent;
      cursor: default;
      pointer-events: all;
    }

    .hover-guide {
      opacity: 0;
      pointer-events: none;
      stroke: rgba(37, 99, 235, 0.58);
      stroke-dasharray: 7 8;
      stroke-width: 2;
      transition: opacity 120ms ease;
    }

    .hover-guide.is-visible {
      opacity: 1;
    }

    .hover-points {
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .hover-points.is-visible {
      opacity: 1;
    }

    .hover-point {
      fill: #ffffff;
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .chart-tooltip {
      position: absolute;
      z-index: 3;
      display: none;
      width: min(230px, calc(100% - 24px));
      padding: 11px 12px 10px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.12);
      font-size: 13px;
      line-height: 1.35;
      pointer-events: none;
    }

    .chart-tooltip.is-visible {
      display: block;
    }

    .tooltip-time {
      margin-bottom: 7px;
      color: var(--focus);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .tooltip-row {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 3px 0;
    }

    .tooltip-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--item-color);
      box-shadow: 0 0 12px color-mix(in srgb, var(--item-color) 55%, transparent);
    }

    .tooltip-label {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tooltip-count {
      color: var(--text);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 15px;
      font-weight: 700;
    }

    @media (max-width: 680px) {
      .page {
        margin: 16px auto;
      }

      .chart-area {
        padding: 18px 12px 20px;
      }

      .tick {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="교통량 다중 그래프 시안">

    <section class="chart-area">
      <div class="chart-scroll" tabindex="0">
      <svg viewBox="0 0 1160 700" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">여러 방향 교통량 꺾은선 그래프</title>
        <desc id="chart-desc">시간 축과 교통량 축 위에 서로 다른 색상의 얇은 꺾은선 다섯 개가 표시된 그래프</desc>

        <rect class="plot-frame" x="90" y="46" width="1000" height="548" rx="6" fill="#ffffff" stroke="#dbe3ea" stroke-width="1.5"></rect>
        <path class="plot-overlay-lines" d="M90 95 H1090 M90 145 H1090 M90 195 H1090" stroke="#e2e8f0" stroke-width="1" opacity="0.65"></path>

        <g class="y-grid-lines" aria-hidden="true">
          <line class="grid" x1="120" y1="570" x2="1070" y2="570"></line>
          <line class="grid" x1="120" y1="470" x2="1070" y2="470"></line>
          <line class="grid" x1="120" y1="370" x2="1070" y2="370"></line>
          <line class="grid" x1="120" y1="270" x2="1070" y2="270"></line>
          <line class="grid" x1="120" y1="170" x2="1070" y2="170"></line>
          <line class="grid" x1="120" y1="70" x2="1070" y2="70"></line>
        </g>

        <g class="x-grid-lines" aria-hidden="true"></g>

        <line class="axis x-axis" x1="120" y1="570" x2="1070" y2="570"></line>
        <line class="axis" x1="120" y1="70" x2="120" y2="570"></line>

        <text class="tick" x="102" y="577" text-anchor="end">0</text>
        <text class="tick" x="102" y="477" text-anchor="end">200</text>
        <text class="tick" x="102" y="377" text-anchor="end">400</text>
        <text class="tick" x="102" y="277" text-anchor="end">600</text>
        <text class="tick" x="102" y="177" text-anchor="end">800</text>
        <text class="tick" x="102" y="77" text-anchor="end">1000</text>

        <g class="x-ticks" aria-hidden="true"></g>

        <text class="axis-label" x="595" y="660" text-anchor="middle">시간</text>
        <text class="axis-label" x="42" y="320" text-anchor="middle" transform="rotate(-90 42 320)">교통량</text>

        <path class="series" stroke="#15803d"></path>
        <path class="series" stroke="#b45309"></path>
        <path class="series" stroke="#0369a1"></path>
        <path class="series" stroke="#dc2626"></path>
        <path class="series" stroke="#7c3aed"></path>

        <line class="hover-guide" x1="120" y1="70" x2="120" y2="570"></line>
        <g class="hover-points" aria-hidden="true"></g>
        <rect class="hover-capture" x="90" y="46" width="1000" height="548" rx="6"></rect>
      </svg>
      </div>
      <ul class="legend" aria-label="그래프 범례">
        <li><span class="swatch" style="--line-color: var(--green)"></span>북측</li>
        <li><span class="swatch" style="--line-color: var(--amber)"></span>동측</li>
        <li><span class="swatch" style="--line-color: var(--cyan)"></span>남측</li>
        <li><span class="swatch" style="--line-color: var(--coral)"></span>서측</li>
        <li><span class="swatch" style="--line-color: var(--violet)"></span>순환</li>
      </ul>
      <div class="chart-tooltip" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    (() => {
      const chartArea = document.querySelector(".chart-area");
      const svg = chartArea.querySelector("svg");
      const capture = svg.querySelector(".hover-capture");
      const guide = svg.querySelector(".hover-guide");
      const pointLayer = svg.querySelector(".hover-points");
      const xTickLayer = svg.querySelector(".x-ticks");
      const xGridLayer = svg.querySelector(".x-grid-lines");
      const yGridLines = svg.querySelectorAll(".y-grid-lines .grid");
      const plotFrame = svg.querySelector(".plot-frame");
      const plotOverlayLines = svg.querySelector(".plot-overlay-lines");
      const xAxis = svg.querySelector(".x-axis");
      const xAxisLabel = svg.querySelector(".axis-label");
      const seriesPaths = svg.querySelectorAll(".series");
      const tooltip = chartArea.querySelector(".chart-tooltip");
      const traffic = [
        { time: "00:00", values: [140, 220, 80, 300, 40] },
        { time: "04:00", values: [280, 180, 140, 360, 120] },
        { time: "08:00", values: [320, 420, 240, 540, 380] },
        { time: "12:00", values: [620, 520, 360, 440, 280] },
        { time: "16:00", values: [540, 660, 580, 500, 420] },
        { time: "20:00", values: [700, 620, 540, 780, 500] },
        { time: "24:00", values: [620, 720, 480, 820, 560] },
      ];
      const chart = {
        baseWidth: 1160,
        left: 120,
        right: 1070,
        top: 70,
        bottom: 570,
        frameX: 90,
        framePaddingRight: 20,
        pointGap: 950 / 6,
        maxValue: 1000,
      };
      const plotWidth = Math.max(chart.right - chart.left, (traffic.length - 1) * chart.pointGap);
      const plotRight = chart.left + plotWidth;
      const chartWidth = plotRight + 90;
      const xPositions = traffic.map((_, index) => (
        chart.left + (traffic.length === 1 ? 0 : (plotWidth / (traffic.length - 1)) * index)
      ));
      const yPositions = Array.from({ length: 5 }, (_, seriesIndex) => traffic.map((item) => (
        chart.bottom - (item.values[seriesIndex] / chart.maxValue) * (chart.bottom - chart.top)
      )));
      const series = [
        { label: "북측", color: "#15803d" },
        { label: "동측", color: "#b45309" },
        { label: "남측", color: "#0369a1" },
        { label: "서측", color: "#dc2626" },
        { label: "순환", color: "#7c3aed" },
      ];
      const svgNamespace = "http://www.w3.org/2000/svg";
      const formatter = new Intl.NumberFormat("ko-KR");
      const formatXAxisLabel = (label) => {
        const value = String(label).trim();
        const timeMatch = value.match(/^(\d{1,2}):(\d{2})$/);
        const dateMatch = value.match(/^(\d{1,2})월\s*(\d{1,2})일$/);

        if (timeMatch) {
          return [timeMatch[1].padStart(2, "0"), timeMatch[2]];
        }

        if (dateMatch) {
          return [dateMatch[1].padStart(2, "0"), dateMatch[2].padStart(2, "0")];
        }

        return [value];
      };
      const xTickLabels = traffic.map((item) => formatXAxisLabel(item.time));
      const markers = series.map((item) => {
        const marker = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        marker.setAttribute("class", "hover-point");
        marker.setAttribute("r", "5.5");
        marker.setAttribute("stroke", item.color);
        pointLayer.append(marker);
        return marker;
      });

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      const seriesPath = (points) => xPositions.map((x, index) => (
        `${index === 0 ? "M" : "L"}${x} ${points[index]}`
      )).join(" ");

      const renderChartFrame = () => {
        const frameWidth = plotWidth + chart.left - chart.frameX + chart.framePaddingRight;

        svg.setAttribute("viewBox", `0 0 ${chartWidth} 700`);
        svg.style.width = `${(chartWidth / chart.baseWidth) * 100}%`;
        plotFrame.setAttribute("width", frameWidth);
        capture.setAttribute("width", frameWidth);
        plotOverlayLines.setAttribute("d", `M90 95 H${plotRight + chart.framePaddingRight} M90 145 H${plotRight + chart.framePaddingRight} M90 195 H${plotRight + chart.framePaddingRight}`);
        xAxis.setAttribute("x2", plotRight);
        xAxisLabel.setAttribute("x", (chart.left + plotRight) / 2);

        yGridLines.forEach((line) => {
          line.setAttribute("x2", plotRight);
        });

        xGridLayer.replaceChildren();
        xPositions.forEach((x) => {
          const line = document.createElementNS(svgNamespace, "line");

          line.setAttribute("class", "grid");
          line.setAttribute("x1", x);
          line.setAttribute("y1", chart.top);
          line.setAttribute("x2", x);
          line.setAttribute("y2", chart.bottom);
          xGridLayer.appendChild(line);
        });

        seriesPaths.forEach((path, index) => {
          path.setAttribute("d", seriesPath(yPositions[index]));
        });
      };

      const renderXAxisTicks = () => {
        xTickLayer.replaceChildren();

        xTickLabels.forEach((lines, index) => {
          const text = document.createElementNS(svgNamespace, "text");

          text.setAttribute("class", "tick");
          text.setAttribute("x", xPositions[index]);
          text.setAttribute("y", lines.length > 1 ? "604" : "612");
          text.setAttribute("text-anchor", "middle");

          lines.forEach((line, lineIndex) => {
            const tspan = document.createElementNS(svgNamespace, "tspan");

            tspan.setAttribute("x", xPositions[index]);
            if (lineIndex > 0) {
              tspan.setAttribute("dy", "22");
            }
            tspan.textContent = line;
            text.appendChild(tspan);
          });

          xTickLayer.appendChild(text);
        });
      };

      const toSvgPoint = (event) => {
        const point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        return point.matrixTransform(svg.getScreenCTM().inverse());
      };

      const nearestIndex = (x) => {
        const boundedX = clamp(x, xPositions[0], xPositions[xPositions.length - 1]);
        return xPositions.reduce((nearest, current, index) => (
          Math.abs(current - boundedX) < Math.abs(xPositions[nearest] - boundedX) ? index : nearest
        ), 0);
      };

      const positionTooltip = (event) => {
        const area = chartArea.getBoundingClientRect();
        const offset = 14;
        let left = event.clientX - area.left + offset;
        let top = event.clientY - area.top + offset;
        const tooltipWidth = tooltip.offsetWidth;
        const tooltipHeight = tooltip.offsetHeight;

        if (left + tooltipWidth > area.width - 8) {
          left = event.clientX - area.left - tooltipWidth - offset;
        }

        if (top + tooltipHeight > area.height - 8) {
          top = event.clientY - area.top - tooltipHeight - offset;
        }

        tooltip.style.left = `${clamp(left, 8, area.width - tooltipWidth - 8)}px`;
        tooltip.style.top = `${clamp(top, 8, area.height - tooltipHeight - 8)}px`;
      };

      const renderRows = (values) => series.map((item, index) => `
        <div class="tooltip-row">
          <span class="tooltip-swatch" style="--item-color: ${item.color}"></span>
          <span class="tooltip-label">${item.label}</span>
          <strong class="tooltip-count">${formatter.format(values[index])}</strong>
        </div>
      `).join("");

      const updateMarkers = (index) => {
        markers.forEach((marker, seriesIndex) => {
          marker.setAttribute("cx", xPositions[index]);
          marker.setAttribute("cy", yPositions[seriesIndex][index]);
        });
        pointLayer.classList.add("is-visible");
      };

      const showTooltip = (event) => {
        const point = toSvgPoint(event);
        const index = nearestIndex(point.x);
        const item = traffic[index];

        guide.setAttribute("x1", xPositions[index]);
        guide.setAttribute("x2", xPositions[index]);
        guide.classList.add("is-visible");
        updateMarkers(index);
        tooltip.innerHTML = `
          <div class="tooltip-time">${item.time}</div>
          ${renderRows(item.values)}
        `;
        tooltip.classList.add("is-visible");
        positionTooltip(event);
      };

      const hideTooltip = () => {
        guide.classList.remove("is-visible");
        pointLayer.classList.remove("is-visible");
        tooltip.classList.remove("is-visible");
      };

      renderChartFrame();
      renderXAxisTicks();
      capture.addEventListener("pointerenter", showTooltip);
      capture.addEventListener("pointermove", showTooltip);
      capture.addEventListener("pointerleave", hideTooltip);
    })();
  </script>
</body>
</html>
