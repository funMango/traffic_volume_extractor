<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교통량 단일 그래프</title>
  <style>
    :root {
      --surface: #ffffff;
      --page: #ffffff;
      --plot: #ffffff;
      --rule: #94a3b8;
      --rule-soft: #e5e7eb;
      --text: #172033;
      --muted: #667085;
      --signal: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--surface);
      font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    .page {
      width: 210mm;
      max-width: calc(100vw - 32px);
      margin: 32px auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      background: var(--page);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.14);
    }

    .chart-area {
      position: relative;
      padding: 22px 24px 26px;
      background: var(--page);
    }

    .chart-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-gutter: stable;
    }

    .chart-scroll:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 4px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .tick {
      fill: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 18px;
    }

    .grid {
      stroke: var(--rule-soft);
      stroke-width: 1;
    }

    .axis {
      stroke: var(--rule);
      stroke-width: 2;
    }

    .hover-capture {
      fill: transparent;
      cursor: default;
      pointer-events: all;
    }

    .hover-guide {
      opacity: 0;
      pointer-events: none;
      stroke: rgba(37, 99, 235, 0.58);
      stroke-dasharray: 7 8;
      stroke-width: 2;
      transition: opacity 120ms ease;
    }

    .hover-guide.is-visible {
      opacity: 1;
    }

    .hover-point {
      opacity: 0;
      fill: #ffffff;
      stroke: var(--signal);
      stroke-width: 3;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .hover-point.is-visible {
      opacity: 1;
    }

    .chart-tooltip {
      position: absolute;
      z-index: 3;
      display: none;
      min-width: 142px;
      max-width: min(240px, calc(100% - 24px));
      padding: 11px 12px 10px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.12);
      font-size: 13px;
      line-height: 1.35;
      pointer-events: none;
    }

    .chart-tooltip.is-visible {
      display: block;
    }

    .tooltip-time {
      color: var(--signal);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .tooltip-value {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-top: 7px;
    }

    .tooltip-label {
      color: var(--muted);
    }

    .tooltip-count {
      color: var(--text);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 18px;
      font-weight: 700;
    }

    @media (max-width: 680px) {
      .page {
        margin: 16px auto;
      }
      .chart-area {
        padding: 18px 12px 20px;
      }

      .tick {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="교통량 단일 그래프 시안">
    <section class="chart-area">
      <div class="chart-scroll" tabindex="0">
      <svg viewBox="0 0 1160 700" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">단일 교통량 꺾은선 그래프</title>
        <desc id="chart-desc">시간 축과 교통량 축 위에 선 아래가 그라데이션으로 채워진 단일 꺾은선 그래프</desc>
        <defs>
          <linearGradient id="traffic-fill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22"></stop>
            <stop offset="58%" stop-color="#2563eb" stop-opacity="0.08"></stop>
            <stop offset="100%" stop-color="#2563eb" stop-opacity="0.02"></stop>
          </linearGradient>
          <filter id="line-shadow" x="-8%" y="-12%" width="116%" height="124%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="10"></feGaussianBlur>
          </filter>
        </defs>

        <rect class="plot-frame" x="90" y="46" width="1000" height="548" rx="6" fill="#ffffff" stroke="none"></rect>

        <g class="x-grid-lines" aria-hidden="true"></g>

        <line class="axis x-axis" x1="120" y1="570" x2="1070" y2="570"></line>
        <line class="axis" x1="120" y1="70" x2="120" y2="570"></line>

        <text class="tick" x="102" y="577" text-anchor="end">0</text>
        <text class="tick" x="102" y="477" text-anchor="end">200</text>
        <text class="tick" x="102" y="377" text-anchor="end">400</text>
        <text class="tick" x="102" y="277" text-anchor="end">600</text>
        <text class="tick" x="102" y="177" text-anchor="end">800</text>
        <text class="tick" x="102" y="77" text-anchor="end">1000</text>

        <g class="x-ticks" aria-hidden="true"></g>

        <path class="traffic-area" fill="url(#traffic-fill)"></path>
        <path class="traffic-line" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.14" filter="url(#line-shadow)"></path>
        <path class="traffic-line" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
        <path class="traffic-line" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"></path>
        <line class="hover-guide" x1="120" y1="70" x2="120" y2="570"></line>
        <g class="hover-point-layer" aria-hidden="true">
          <circle class="hover-point" cx="120" cy="520" r="6"></circle>
        </g>
        <rect class="hover-capture" x="90" y="46" width="1000" height="548" rx="6"></rect>
      </svg>
      </div>
      <div class="chart-tooltip" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    (() => {
      const chartArea = document.querySelector(".chart-area");
      const svg = chartArea.querySelector("svg");
      const capture = svg.querySelector(".hover-capture");
      const guide = svg.querySelector(".hover-guide");
      const hoverPoint = svg.querySelector(".hover-point");
      const xTickLayer = svg.querySelector(".x-ticks");
      const xGridLayer = svg.querySelector(".x-grid-lines");
      const plotFrame = svg.querySelector(".plot-frame");
      const xAxis = svg.querySelector(".x-axis");
      const trafficArea = svg.querySelector(".traffic-area");
      const trafficLines = svg.querySelectorAll(".traffic-line");
      const tooltip = chartArea.querySelector(".chart-tooltip");
      const traffic = [
        { time: "00:00", value: 120 },
        { time: "01:00", value: 96 },
        { time: "02:00", value: 84 },
        { time: "03:00", value: 110 },
        { time: "04:00", value: 170 },
        { time: "05:00", value: 260 },
        { time: "06:00", value: 420 },
        { time: "07:00", value: 610 },
        { time: "08:00", value: 740 },
        { time: "09:00", value: 680 },
        { time: "10:00", value: 590 },
        { time: "11:00", value: 560 },
        { time: "12:00", value: 630 },
        { time: "13:00", value: 610 },
        { time: "14:00", value: 580 },
        { time: "15:00", value: 620 },
        { time: "16:00", value: 760 },
        { time: "17:00", value: 860 },
        { time: "18:00", value: 820 },
        { time: "19:00", value: 700 },
        { time: "20:00", value: 610 },
        { time: "21:00", value: 470 },
        { time: "22:00", value: 330 },
        { time: "23:00", value: 210 },
      ];
      const chart = {
        baseWidth: 1160,
        left: 120,
        right: 1070,
        top: 70,
        bottom: 570,
        frameX: 90,
        framePaddingRight: 20,
        pointGap: 950 / 6,
        maxValue: 1000,
      };
      const plotWidth = Math.max(chart.right - chart.left, (traffic.length - 1) * chart.pointGap);
      const plotRight = chart.left + plotWidth;
      const chartWidth = plotRight + 90;
      const xPositions = traffic.map((_, index) => (
        chart.left + (traffic.length === 1 ? 0 : (plotWidth / (traffic.length - 1)) * index)
      ));
      const yPositions = traffic.map((item) => (
        chart.bottom - (item.value / chart.maxValue) * (chart.bottom - chart.top)
      ));
      const formatter = new Intl.NumberFormat("ko-KR");
      const svgNamespace = "http://www.w3.org/2000/svg";
      const formatXAxisLabel = (label) => {
        const value = String(label).trim();
        const timeMatch = value.match(/^(\d{1,2}):(\d{2})$/);
        const dateMatch = value.match(/^(\d{1,2})월\s*(\d{1,2})일$/);

        if (timeMatch) {
          return [timeMatch[1].padStart(2, "0"), timeMatch[2]];
        }

        if (dateMatch) {
          return [dateMatch[1].padStart(2, "0"), dateMatch[2].padStart(2, "0")];
        }

        return [value];
      };
      const xTickLabels = traffic.map((item) => formatXAxisLabel(item.time));

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      const pointsPath = () => xPositions.map((x, index) => (
        `${index === 0 ? "M" : "L"}${x} ${yPositions[index]}`
      )).join(" ");

      const renderChartFrame = () => {
        const frameWidth = plotWidth + chart.left - chart.frameX + chart.framePaddingRight;

        svg.setAttribute("viewBox", `0 0 ${chartWidth} 700`);
        svg.style.width = `${(chartWidth / chart.baseWidth) * 100}%`;
        plotFrame.setAttribute("width", frameWidth);
        capture.setAttribute("width", frameWidth);
        xAxis.setAttribute("x2", plotRight);

        xGridLayer.replaceChildren();
        xPositions.forEach((x) => {
          const line = document.createElementNS(svgNamespace, "line");

          line.setAttribute("class", "grid");
          line.setAttribute("x1", x);
          line.setAttribute("y1", chart.top);
          line.setAttribute("x2", x);
          line.setAttribute("y2", chart.bottom);
          xGridLayer.appendChild(line);
        });

        const linePath = pointsPath();
        trafficArea.setAttribute("d", `${linePath} L${plotRight} ${chart.bottom} L${chart.left} ${chart.bottom} Z`);
        trafficLines.forEach((line) => {
          line.setAttribute("d", linePath);
        });
      };

      const renderXAxisTicks = () => {
        xTickLayer.replaceChildren();

        xTickLabels.forEach((label, index) => {
          const lines = Array.isArray(label) ? label : [label];
          const text = document.createElementNS(svgNamespace, "text");

          text.setAttribute("class", "tick");
          text.setAttribute("x", xPositions[index]);
          text.setAttribute("y", lines.length > 1 ? "604" : "612");
          text.setAttribute("text-anchor", "middle");

          lines.forEach((line, lineIndex) => {
            const tspan = document.createElementNS(svgNamespace, "tspan");

            tspan.setAttribute("x", xPositions[index]);
            if (lineIndex > 0) {
              tspan.setAttribute("dy", "22");
            }
            tspan.textContent = line;
            text.appendChild(tspan);
          });

          xTickLayer.appendChild(text);
        });
      };

      const toSvgPoint = (event) => {
        const point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        return point.matrixTransform(svg.getScreenCTM().inverse());
      };

      const nearestIndex = (x) => {
        const boundedX = clamp(x, xPositions[0], xPositions[xPositions.length - 1]);
        return xPositions.reduce((nearest, current, index) => (
          Math.abs(current - boundedX) < Math.abs(xPositions[nearest] - boundedX) ? index : nearest
        ), 0);
      };

      const positionTooltip = (event) => {
        const area = chartArea.getBoundingClientRect();
        const offset = 14;
        let left = event.clientX - area.left + offset;
        let top = event.clientY - area.top + offset;
        const tooltipWidth = tooltip.offsetWidth;
        const tooltipHeight = tooltip.offsetHeight;

        if (left + tooltipWidth > area.width - 8) {
          left = event.clientX - area.left - tooltipWidth - offset;
        }

        if (top + tooltipHeight > area.height - 8) {
          top = event.clientY - area.top - tooltipHeight - offset;
        }

        tooltip.style.left = `${clamp(left, 8, area.width - tooltipWidth - 8)}px`;
        tooltip.style.top = `${clamp(top, 8, area.height - tooltipHeight - 8)}px`;
      };

      const showTooltip = (event) => {
        const point = toSvgPoint(event);
        const index = nearestIndex(point.x);
        const item = traffic[index];

        guide.setAttribute("x1", xPositions[index]);
        guide.setAttribute("x2", xPositions[index]);
        guide.classList.add("is-visible");
        hoverPoint.setAttribute("cx", xPositions[index]);
        hoverPoint.setAttribute("cy", yPositions[index]);
        hoverPoint.classList.add("is-visible");
        tooltip.innerHTML = `
          <div class="tooltip-time">${item.time}</div>
          <div class="tooltip-value">
            <span class="tooltip-label">교통량</span>
            <strong class="tooltip-count">${formatter.format(item.value)}</strong>
          </div>
        `;
        tooltip.classList.add("is-visible");
        positionTooltip(event);
      };

      const hideTooltip = () => {
        guide.classList.remove("is-visible");
        hoverPoint.classList.remove("is-visible");
        tooltip.classList.remove("is-visible");
      };

      renderChartFrame();
      renderXAxisTicks();
      capture.addEventListener("pointerenter", showTooltip);
      capture.addEventListener("pointermove", showTooltip);
      capture.addEventListener("pointerleave", hideTooltip);
    })();
  </script>
</body>
</html>
