<style>
:root {
  --bg:     #F0F2F5;
  --card:   #FFFFFF;
  --border: #E2E8F0;
  --t1:     #1A202C;
  --t2:     #4A5568;
  --t3:     #A0AEC0;
  --accent: #2B6CB0;
  --r:      14px;
  --sans:   'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:   'JetBrains Mono', 'Consolas', monospace;

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:14px; -webkit-font-smoothing:antialiased; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--t1);
  padding: 44px 36px;
  min-height: 100vh;
}
.wrap { max-width:1600px; margin:0 auto; }

/* ── 상단 헤더 ── */
.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 28px;
}
.eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}
.page-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--t1);
  line-height: 1;
}
.page-desc {
  font-size: 13px;
  color: var(--t2);
  margin-top: 6px;
  font-weight: 400;
}
.period-badge {
  align-self: flex-start;
  background: #EBF4FF;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: 100px;
  border: 1px solid #BEE3F8;
  letter-spacing: 0.04em;
  white-space: nowrap;
  margin-top: 4px;
}

/* ── 카드 ── */
.card {
  background: var(--card);
  border-radius: var(--r);
  border: 1px solid var(--border);
  box-shadow:
    0 1px 2px rgba(0,0,0,0.04),
    0 4px 12px rgba(0,0,0,0.05),
    0 16px 40px rgba(0,0,0,0.04);
  padding: 32px 28px 24px;
  animation: rise .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── 범례 ── */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--t2);
}
.legend-swatch {
  width: 28px;
  height: 3px;
  border-radius: 99px;
  flex-shrink: 0;
}

/* ── 차트 제목 ── */
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--t1);
  letter-spacing: -0.02em;
  margin-bottom: 16px;
}

/* ── 차트 ── */
.chart-outer {
  overflow-x: auto;
  overflow-y: hidden;
  width: 100%;
}
.chart-inner {
  position: relative;
  height: 440px;
  min-width: 100%;
}
.chart-inner canvas { display: block; }

/* ── 통계 ── */
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin-top: 22px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.stat {
  padding-right: 32px;
  margin-right: 32px;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right:none; padding-right:0; margin-right:0; }
.stat-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t3);
  margin-bottom: 5px;
}
.stat-val {
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 500;
  color: var(--t1);
  letter-spacing: -0.03em;
  line-height: 1;
}
.stat-unit {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 400;
  color: var(--t3);
  margin-left: 4px;
}

/* ── 푸터 ── */
.footer {
  text-align: center;
  font-size: 11px;
  color: var(--t3);
  margin-top: 20px;
  letter-spacing: 0.03em;
}
</style>
</head>
